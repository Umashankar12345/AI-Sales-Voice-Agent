# Render Blueprint — Docker Web Service for VoxSales AI (with SalesPilot AI capabilities)
services:
  - type: web
    name: voxsales-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: voxsales_db
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
